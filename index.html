<body>
<main>
<header><div><small id="age"></small><h1 id="nm"></h1></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><button id="tg" class="tgl" onclick="setTheme(theme==='dark'?'light':'dark')" aria-label="Ganti tema terang atau gelap">🌙</button><small id="dt"></small></div></header>
<div id="app"></div>
</main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const KEY='catatan-si-kecil-v1';let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||{baby:{},logs:{},growth:[]}}
let db=load();db.baby=db.baby||{};db.logs=db.logs||{};db.growth=db.growth||[];
function save(){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const $=s=>document.querySelector(s);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const n=x=>Math.round(x).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=(k,o)=>new Date(k+'T00:00').toLocaleDateString('id-ID',o||{weekday:'short',day:'numeric',month:'short'});
const sum=a=>(a||[]).reduce((s,x)=>s+x.ml,0);
let cur=iso(new Date()),tab='today',rk='m',rm=cur.slice(0,7),ry=cur.slice(0,4),tmv=null;
const growthSorted=()=>db.growth.slice().sort((a,b)=>a.d<b.d?-1:1);
function lastW(){const g=growthSorted().filter(x=>x.w);return g.length?g[g.length-1].w:kg(db.baby.bw)}
function target(){return +db.baby.target||(lastW()?Math.round(lastW()*150/10)*10:0)}
function age(){const b=db.baby.dob;if(!b)return'';const a=new Date(b+'T00:00'),t=new Date();let m=(t.getFullYear()-a.getFullYear())*12+t.getMonth()-a.getMonth(),d=t.getDate()-a.getDate();if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0)return'';const y=Math.floor(m/12);return(y?y+' th ':'')+m%12+' bln '+d+' hr'}
function toast(t){const e=$('#toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',1600)}
function shift(k,d){const x=new Date(k+'T00:00');x.setDate(x.getDate()+d);return iso(x)}
function go(t){tab=t;render();scrollTo(0,0)}
function add(kind,ml){ml=+ml;if(!(ml>0)){toast('Isi jumlah ml dulu');return}
 const d=db.logs[cur]||(db.logs[cur]={milk:[],pump:[]});d.tg=target();(d[kind]=d[kind]||[]).push({id:Date.now()+Math.random(),t:tmv||$('#tm').value||nowT(),ml});save();render();toast('Tersimpan: '+ml+' ml')}
function del(kind,id){const d=db.logs[cur];d[kind]=d[kind].filter(x=>x.id!==id);save();render()}
function entry(kind,title,chips,cls){
 const arr=((db.logs[cur]||{})[kind]||[]).slice().sort((a,b)=>a.t<b.t?-1:1),tot=sum(arr);
 let top='';
 if(kind==='milk'){const tg=target(),p=tg?Math.min(100,tot/tg*100):0;
  top=`<div class="big">${n(tot)} <span class="mut">${tg?'/ '+n(tg)+' ml':'ml'}</span></div>`+(tg?`<div class="bar ${tot>=tg?'ok':''}"><i style="width:${p}%"></i></div><div class="mut">${tot>=tg?'<span class="ok-t">🎉 Target tercapai, hebat!</span>':'Kurang '+n(tg-tot)+' ml lagi'}</div>`:`<div class="mut">Isi target atau berat badan di Profil/Tumbuh.</div>`)}
 else top=`<div class="big">${n(tot)} <span class="mut">ml hari ini</span></div>`;
 return `<section class="card ${cls}"><h2>${title}<span class="mut">${arr.length}x</span></h2>${top}
 <div class="chips">${chips.map(c=>`<button class="chip" onclick="add('${kind}',${c})">+${c}</button>`).join('')}</div>
 <div class="row"><input id="c-${kind}" type="number" inputmode="numeric" placeholder="ml lain"><button class="btn" onclick="add('${kind}',$('#c-${kind}').value)">Tambah</button></div>
 ${arr.map(x=>`<div class="item"><span><b>${x.t}</b> &nbsp; ${n(x.ml)} ml</span><button aria-label="Hapus" onclick="del('${kind}',${x.id})">✕</button></div>`).join('')}</section>`}
function vToday(){
 return `<div class="dates"><button class="chip" onclick="cur=shift(cur,-1);render()" aria-label="Hari sebelumnya">‹</button><input type="date" value="${cur}" max="${iso(new Date())}" onchange="cur=this.value||cur;render()"><button class="chip" onclick="cur=shift(cur,1);render()" aria-label="Hari berikutnya">›</button></div>
 <div class="row" style="margin-bottom:10px"><label style="margin:0;white-space:nowrap">⏰ Jam catat</label><input id="tm" type="time" value="${tmv||nowT()}" onchange="tmv=this.value"></div>`
 +entry('milk','🍼 Susu',[60,90,120,150],'milk')+entry('pump','💧 Pumping ASI',[50,80,100,150],'pump')}
/* WHO Child Growth Standards 0–24 bln: P3, P15, P50, P85, P97 (L=laki-laki, P=perempuan) */
const S=s=>s.split(' ').map(Number);

 <label>Nama</label><input id="pn" value="${esc(b.name)}" placeholder="Nama bayi">
 <label>Tanggal lahir</label><input id="pd" type="date" value="${esc(b.dob)}">
 <div class="grid"><div><label>Jenis kelamin</label><select id="ps"><option value="">–</option><option ${b.sex==='Laki-laki'?'selected':''}>Laki-laki</option><option ${b.sex==='Perempuan'?'selected':''}>Perempuan</option></select></div><div><label>Berat lahir (kg)</label><input id="pb" type="text" inputmode="decimal" placeholder="3,1 atau 3100" value="${esc(b.bw?String(kg(b.bw)).replace('.',','):'')}"></div></div>
 <label>Target susu per hari (ml)</label><input id="pt" type="number" inputmode="numeric" value="${esc(b.target)}" placeholder="Kosongkan = otomatis ${lastW()?n(Math.round(lastW()*15)*10)+' ml':'dari berat badan'}">
 <p class="mut">Otomatis memakai perkiraan 150 ml per kg berat badan. Tanyakan ke dokter anak untuk target yang sesuai.</p>
 <button class="btn" style="width:100%" onclick="saveP()">Simpan</button></section>
 <section class="card lil"><h2>💾 Cadangan data</h2><p class="mut">Data tersimpan di HP ini saja. Salin cadangan dan simpan di catatan/WhatsApp Anda agar aman.</p>
 <textarea id="bk" rows="4" placeholder="Teks cadangan muncul di sini"></textarea>
 <div class="row" style="margin-top:8px"><button class="btn alt" style="flex:1" onclick="$('#bk').value=JSON.stringify(db);$('#bk').select();try{navigator.clipboard.writeText($('#bk').value);toast('Disalin')}catch(e){}">Salin cadangan</button><button class="btn alt" style="flex:1" onclick="restore()">Pulihkan</button></div></section>`}
function saveP(){db.baby={name:$('#pn').value.trim(),dob:$('#pd').value,sex:$('#ps').value,bw:kg($('#pb').value)||'',target:$('#pt').value};save();render();toast('Tersimpan')}
function restore(){try{const o=JSON.parse($('#bk').value);if(!o.logs||!o.baby)throw 0;db=o;db.growth=db.growth||[];save();render();toast('Data dipulihkan')}catch(e){toast('Teks cadangan tidak valid')}}
function render(){
 $('#nm').textContent=db.baby.name||'Si Kecil';$('#age').textContent=age()||'Isi data di Profil';
 $('#dt').textContent=fd(iso(new Date()),{weekday:'short',day:'numeric',month:'short'});
 const tabs=[['today','🍼','Harian'],['grow','📏','Tumbuh'],['rekap','📊','Rekap'],['profil','👶','Profil']];
 $('#nav').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $('#app').innerHTML={today:vToday,grow:vGrow,rekap:vRekap,profil:vProfil}[tab]();
 const a=document.activeElement;
}
let theme='light';try{theme=localStorage.getItem('sk-theme')||'light'}catch(e){}
function setTheme(t){theme=t;document.documentElement.dataset.theme=t;try{localStorage.setItem('sk-theme',t)}catch(e){}$('#tg').textContent=t==='dark'?'☀️':'🌙'}
setTheme(theme);
render();
</script>
</body>
</html>
